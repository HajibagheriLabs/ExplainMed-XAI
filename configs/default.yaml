seed: 42
device: cuda
# caps torch intra-op threads; heavy work is meant to run on the gpu
cpu_threads: 2

paths:
  metadata_csv: data/raw/ham10000/HAM10000_metadata.csv
  images_dir: data/raw/ham10000/images
  masks_dir: data/raw/ham10000/segmentations
  cache_dir: data/processed
  splits_file: configs/splits.json
  reports_dir: reports
  runs_dir: runs
  mlflow_dir: mlruns

data:
  image_size: 224
  decode_batch_size: 64
  # imagenet statistics, matching the pretrained image encoders
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  val_fraction: 0.15
  test_fraction: 0.15

model:
  text_encoder: distilbert-base-uncased
  dropout: 0.2
  fusion_hidden_dim: 256

train:
  repeats: 3
  # batches of 128 keep the gpu, not the single dispatching cpu core, as the bottleneck
  batch_size: 128
  epochs: 20
  head_lr: 1.0e-3
  image_encoder_lr: 3.0e-4
  text_encoder_lr: 3.0e-5
  weight_decay: 1.0e-2
  warmup_fraction: 0.1
  balanced_loss: true

leakage_demo:
  repeats: 5
  epochs: 12
  batch_size: 64
  lr: 5.0e-4
  weight_decay: 1.0e-4

explain:
  batch_size: 32
  ig_steps: 64
  # interpolation steps evaluated per forward pass; bounds gpu memory, not the result
  ig_batch_size: 128
  examples_per_group: 4

faithfulness:
  # a seeded sample of the test split, shared by every method and model
  subset_size: 500
  steps: 20
  # image attributions are ranked and removed as patches of this many pixels a side
  patch_size: 8
  # removed patches are replaced by the image blurred with this sigma, in pixels
  blur_sigma: 8.0
  top_fraction: 0.1
  confidence_level: 0.95

sanity:
  # the first images of the faithfulness sample
  subset_size: 200
  # fixed before any sanity check was run: a map fails a randomisation if its mean rank
  # correlation with the original map stays at or above this
  similarity_threshold: 0.5
  label_randomisation_epochs: 10

misleading:
  # a wrong prediction at or above this probability counts as confidently wrong
  confidence_threshold: 0.9
  cases: 4
